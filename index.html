<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>냥이 여행 가이드</title>
<style>
:root{
  --blue:#3d7bf0; --blue-d:#2f64cc; --sky:#cfe6ff; --mint:#d9f5e0; --green:#7fdc8f;
  --ink:#1c2740; --sub:#6b7a99; --card:#ffffff; --line:#e3ebf7;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",system-ui,sans-serif;
  color:var(--ink);
  background:linear-gradient(160deg,#e8f2ff,#e3f8ea);
  display:flex;align-items:center;justify-content:center;
}
.phone{
  position:relative;width:100%;height:100dvh;max-width:430px;
  display:flex;flex-direction:column;overflow:hidden;
  background:linear-gradient(180deg,#bfe0ff 0%,#d7f1ff 38%,#dff6e6 100%);
}
@media(min-width:520px){
  .phone{height:min(860px,94dvh);border-radius:38px;box-shadow:0 24px 70px rgba(61,123,240,.28),0 0 0 9px #fff}
}
/* floating decorations */
.phone::before,.phone::after{content:"";position:absolute;border-radius:50%;filter:blur(2px);pointer-events:none;opacity:.55}
.phone::before{width:220px;height:220px;right:-80px;top:80px;background:radial-gradient(circle,#fff,transparent 70%)}
.phone::after{width:260px;height:260px;left:-100px;bottom:120px;background:radial-gradient(circle,#b6f0c5,transparent 70%)}

header{
  position:relative;z-index:2;display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top) + 14px) 16px 12px;
  background:rgba(255,255,255,.55);backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,.7);
}
.hav{width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 3px 10px rgba(61,123,240,.2);flex:none}
.hav svg{width:36px;height:36px}
.htxt{flex:1;min-width:0}
.htxt b{display:block;font-size:16px}
.htxt span{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:5px}
.dot{width:7px;height:7px;border-radius:50%;background:#3ccf67}
.iconbtn{width:38px;height:38px;border:0;border-radius:50%;background:#fff;color:var(--blue);display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 8px rgba(61,123,240,.18);font-size:18px}
.iconbtn:active{transform:scale(.92)}

#chat{position:relative;z-index:1;flex:1;overflow-y:auto;padding:14px 14px 8px;scroll-behavior:smooth}
#chat::-webkit-scrollbar{width:0}
.date{text-align:center;margin:6px 0 14px}
.date span{display:inline-block;font-size:12px;color:#fff;background:rgba(80,110,160,.35);padding:4px 12px;border-radius:99px}
.row{display:flex;gap:8px;margin-bottom:10px;align-items:flex-start;animation:pop .25s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
.row.me{flex-direction:row-reverse}
.av{width:38px;height:38px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none;box-shadow:0 2px 8px rgba(61,123,240,.18)}
.av svg{width:30px;height:30px}
.col{display:flex;flex-direction:column;max-width:78%}
.row.me .col{align-items:flex-end}
.name{font-size:12px;color:#4a5b7c;margin:0 0 4px 3px}
.line{display:flex;align-items:flex-end;gap:6px}
.row.me .line{flex-direction:row-reverse}
.bubble{
  padding:10px 13px;border-radius:18px;font-size:15px;line-height:1.55;word-break:break-word;
  background:var(--card);box-shadow:0 2px 8px rgba(61,123,240,.12);
  border-top-left-radius:5px;
}
.row.me .bubble{background:var(--blue);color:#fff;border-radius:18px;border-top-right-radius:5px;box-shadow:0 3px 10px rgba(61,123,240,.35)}
.time{font-size:11px;color:#5f6f90;white-space:nowrap;padding-bottom:2px}
.bubble p{margin:0 0 6px}.bubble p:last-child{margin:0}
.bubble h3,.bubble h4{font-size:15px;margin:8px 0 4px;color:var(--blue-d)}
.bubble h3:first-child,.bubble h4:first-child{margin-top:0}
.bubble ul,.bubble ol{padding-left:19px;margin:4px 0 6px}
.bubble li{margin:2px 0}
.bubble code{background:#eef3ff;padding:1px 5px;border-radius:5px;font-size:13px}
.bubble hr{border:0;border-top:1px dashed #cdd9ee;margin:8px 0}
.photo{position:relative;margin-top:6px;width:100%;border-radius:18px;overflow:hidden;background:#dfe9f7;box-shadow:0 3px 10px rgba(61,123,240,.18);animation:pop .3s ease-out}
.photo img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover}
.photo span{position:absolute;left:8px;bottom:8px;font-size:12px;font-weight:700;color:#fff;background:rgba(20,30,55,.55);padding:3px 10px;border-radius:99px;backdrop-filter:blur(4px)}
.acts{display:flex;flex-direction:column;gap:6px;margin-top:8px;width:100%;animation:pop .3s ease-out}
.act{border:0;font:inherit;font-size:14px;font-weight:700;text-align:left;padding:11px 14px;border-radius:14px;background:#fff;color:var(--blue-d);cursor:pointer;box-shadow:0 2px 8px rgba(61,123,240,.15),inset 0 0 0 1.5px #dbe7fb;display:flex;justify-content:space-between;align-items:center;gap:8px}
.act:first-child{background:var(--blue);color:#fff;box-shadow:0 3px 10px rgba(61,123,240,.35)}
.act:active{transform:scale(.97)}
.act i{font-style:normal;opacity:.6}
.typing{display:flex;gap:4px;padding:4px 2px}
.typing i{width:7px;height:7px;border-radius:50%;background:#9db2d8;animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-5px);opacity:1}}

.chips{position:relative;z-index:2;display:grid;grid-template-rows:repeat(2,auto);grid-auto-flow:column;grid-auto-columns:max-content;gap:8px;overflow-x:auto;padding:6px 14px 8px}
.chips::-webkit-scrollbar{height:0}
.chip{flex:none;border:0;background:#fff;color:var(--blue-d);font:inherit;font-size:13px;font-weight:600;padding:8px 13px;border-radius:99px;cursor:pointer;box-shadow:0 2px 8px rgba(61,123,240,.15)}
.chip:active{transform:scale(.95)}

.inputbar{
  position:relative;z-index:2;display:flex;align-items:flex-end;gap:8px;
  padding:8px 12px calc(env(safe-area-inset-bottom) + 12px);
  background:rgba(255,255,255,.7);backdrop-filter:blur(12px);
}
textarea{
  flex:1;resize:none;border:0;outline:0;background:#fff;font:inherit;font-size:15px;color:var(--ink);
  padding:11px 15px;border-radius:22px;max-height:110px;line-height:1.4;box-shadow:inset 0 0 0 1.5px var(--line);
}
textarea:focus{box-shadow:inset 0 0 0 2px var(--blue)}
.send{width:44px;height:44px;border:0;border-radius:50%;background:var(--blue);color:#fff;cursor:pointer;display:grid;place-items:center;flex:none;box-shadow:0 4px 12px rgba(61,123,240,.4);transition:.15s}
.send:disabled{background:#b9c8e6;box-shadow:none;cursor:default}
.send:not(:disabled):active{transform:scale(.92)}

/* setup / settings sheet */
.sheet-bg{position:absolute;inset:0;z-index:10;background:rgba(28,39,64,.45);display:none;align-items:flex-end}
.sheet-bg.on{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;background:#fff;border-radius:28px 28px 0 0;padding:26px 22px calc(env(safe-area-inset-bottom) + 24px);animation:up .3s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(100%)}}
.sheet .big{display:grid;place-items:center;margin:-62px auto 8px;width:84px;height:84px;border-radius:50%;background:#fff;box-shadow:0 6px 18px rgba(61,123,240,.25)}
.sheet .big svg{width:68px;height:68px}
.sheet h2{text-align:center;font-size:20px;margin-bottom:6px}
.sheet p.d{text-align:center;color:var(--sub);font-size:13.5px;line-height:1.5;margin-bottom:16px}
label{display:block;font-size:12.5px;font-weight:700;color:#4a5b7c;margin:12px 0 6px}
.field{display:flex;gap:6px}
input[type=password],input[type=text],select{
  flex:1;width:100%;border:0;background:#f2f6fd;border-radius:14px;padding:13px 14px;font:inherit;font-size:14.5px;color:var(--ink);outline:0;box-shadow:inset 0 0 0 1.5px transparent
}
input:focus,select:focus{box-shadow:inset 0 0 0 2px var(--blue)}
.eye{border:0;background:#f2f6fd;border-radius:14px;width:48px;cursor:pointer;font-size:17px}
.check{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);margin-top:12px;font-weight:500}
.check input{width:17px;height:17px;accent-color:var(--blue)}
.btn{display:block;width:100%;border:0;background:var(--blue);color:#fff;font:inherit;font-size:16px;font-weight:700;padding:15px;border-radius:16px;margin-top:18px;cursor:pointer}
.btn:active{background:var(--blue-d)}
.btn.ghost{background:#eef3fc;color:var(--blue-d);margin-top:8px}
.btn.danger{background:#fff0f0;color:#e5484d;margin-top:8px}
.note{font-size:11.5px;color:#8b98b3;line-height:1.5;margin-top:12px;text-align:center}
.note a{color:var(--blue)}
.err{color:#e5484d;font-size:12.5px;margin-top:8px;min-height:16px}
</style>
</head>
<body>
<div class="phone" id="phone">
  <header>
    <div class="hav" id="hav"></div>
    <div class="htxt"><b>냥이 여행 가이드</b><span><i class="dot"></i>여행 준비 도우미 · 온라인</span></div>
    <button class="iconbtn" id="newBtn" title="새 대화">✨</button>
    <button class="iconbtn" id="setBtn" title="설정">⚙️</button>
  </header>

  <div id="chat"></div>

  <div class="chips" id="chips"></div>

  <form class="inputbar" id="form">
    <textarea id="input" rows="1" placeholder="여행에 대해 무엇이든 물어보세요"></textarea>
    <button class="send" id="send" disabled aria-label="보내기">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
  </form>

  <div class="sheet-bg" id="sheetBg">
    <div class="sheet">
      <div class="big" id="big"></div>
      <h2 id="sheetTitle">냥이와 여행 준비 시작!</h2>
      <p class="d" id="sheetDesc">Groq API 키를 입력하면 바로 대화할 수 있어요.<br>키는 이 기기의 브라우저에만 저장돼요.</p>
      <label for="key">Groq API 키</label>
      <div class="field">
        <input type="password" id="key" placeholder="gsk_..." autocomplete="off" spellcheck="false">
        <button type="button" class="eye" id="eye" aria-label="키 보기">👁️</button>
      </div>
      <label for="model">모델</label>
      <select id="model">
        <option value="llama-3.3-70b-versatile">Llama 3.3 70B (똑똑함, 추천)</option>
        <option value="llama-3.1-8b-instant">Llama 3.1 8B (빠름)</option>
        <option value="openai/gpt-oss-20b">GPT-OSS 20B</option>
      </select>
      <label class="check"><input type="checkbox" id="remember" checked>이 기기에 키 기억하기 (끄면 탭을 닫을 때 삭제)</label>
      <div class="err" id="err"></div>
      <button class="btn" id="save">저장하고 시작하기</button>
      <button class="btn danger" id="clearKey" style="display:none">저장된 키 삭제</button>
      <button class="btn ghost" id="closeSheet" style="display:none">닫기</button>
      <p class="note">키 발급: <a href="https://console.groq.com/keys" target="_blank" rel="noopener">console.groq.com/keys</a><br>키는 Groq 서버로만 전송되며 다른 곳에는 보내지 않아요.</p>
    </div>
  </div>
</div>

<script>
const CAT = `<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
<defs><radialGradient id="g" cx="50%" cy="40%" r="65%"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#e9eef7"/></radialGradient></defs>
<path d="M12 28 L10 8 L28 17Z" fill="url(#g)" stroke="#d3dcec" stroke-width="1.2" stroke-linejoin="round"/>
<path d="M52 28 L54 8 L36 17Z" fill="url(#g)" stroke="#d3dcec" stroke-width="1.2" stroke-linejoin="round"/>
<path d="M14 24 L13 13 L23 18Z" fill="#ffc9d6"/><path d="M50 24 L51 13 L41 18Z" fill="#ffc9d6"/>
<ellipse cx="32" cy="35" rx="23" ry="20" fill="url(#g)" stroke="#d3dcec" stroke-width="1.2"/>
<path d="M14 21 Q32 6 50 21 L50 24 Q32 14 14 24Z" fill="#3d7bf0"/>
<rect x="28" y="9" width="8" height="5" rx="2.5" fill="#2f64cc"/>
<ellipse cx="23" cy="36" rx="4.2" ry="5.2" fill="#1c2233"/><ellipse cx="41" cy="36" rx="4.2" ry="5.2" fill="#1c2233"/>
<circle cx="24.4" cy="34" r="1.6" fill="#fff"/><circle cx="42.4" cy="34" r="1.6" fill="#fff"/>
<ellipse cx="15" cy="43" rx="4" ry="2.5" fill="#ffc9d6" opacity=".8"/><ellipse cx="49" cy="43" rx="4" ry="2.5" fill="#ffc9d6" opacity=".8"/>
<path d="M30 42 Q32 44 34 42" stroke="#8a6a73" stroke-width="1.5" fill="none" stroke-linecap="round"/>
<path d="M32 40.5 L30.8 42 L33.2 42Z" fill="#f08aa0"/>
</svg>`;
const $ = id => document.getElementById(id);
$('hav').innerHTML = CAT; $('big').innerHTML = CAT;

const SUGGEST = [
  "3박4일 일본 일정 알려줘 🇯🇵",
  "12월 뉴욕 날씨에 맞는 옷 추천해줘 🧥",
  "파리 필수 맛집 알려줘 🥐",
  "해외여행 짐 체크리스트 만들어줘 🧳",
  "유럽 여행 환전 꿀팁 💶",
  "비행기 멀미 줄이는 방법 ✈️"
];
const WELCOME = "안녕하세요! 저는 해외여행 가이드 냥이예요 🐱✈️\n\n일정 짜기, 날씨별 옷차림, 맛집·관광지, 교통, 환전, 입국 준비까지 뭐든 물어보세요!";
const SYSTEM = () => `너는 여행 서비스 앱의 해외여행 가이드 챗봇 '냥이'야. 귀여운 고양이 캐릭터로, 친근하고 다정한 존댓말(~예요, ~해요)을 쓰고 이모지를 적당히 사용해.
- 해외여행과 관련된 질문(일정, 날씨·옷차림, 맛집, 관광지, 교통, 숙소, 환전·결제, 비자·입국, 짐 싸기, 안전, 문화·에티켓 등)에 답해.
- 여행과 무관한 질문에는 부드럽게 여행 이야기로 유도해.
- 일정은 Day별로 오전/오후/저녁 구분하고 동선을 고려해 현실적으로 짜줘. 짧은 헤딩(###)과 목록(-)을 활용해 모바일에서 읽기 쉽게 써.
- 날씨·옷차림은 평균 기온 범위와 레이어링 팁을 알려줘.
- 비자 규정, 가격, 운영시간 등 변동될 수 있는 정보는 출발 전 공식 사이트에서 확인하라고 한 줄 덧붙여. 모르면 지어내지 말고 모른다고 말해.
- 답변은 너무 길지 않게 핵심 위주로. 필요하면 마지막에 한 줄로 되묻기(예: 여행 인원/예산/취향).
- 매 답변의 맨 마지막 줄에는 반드시 아래 형식의 메타 정보 한 줄을 붙여. 본문과 한 줄 띄우고, 코드블록 없이 한 줄 JSON으로만 써.
[[META]]{"place":"도쿄","wiki":"Tokyo","actions":[{"label":"✈️ 비행기 예매하러 가기","type":"flight"},{"label":"📅 상세 일정 보기","type":"ask","prompt":"위 일정을 하루별로 시간대와 이동수단까지 더 자세히 알려줘"},{"label":"🏨 숙소 보러 가기","type":"hotel"}]}
  · place: 답변의 중심 여행지(한국어). wiki: 그 여행지의 영어 위키백과 문서 제목(예: Tokyo, New York City, Paris). 특정 여행지가 없으면 둘 다 빈 문자열.
  · actions: 사용자가 다음에 할 만한 행동 정확히 3개. type은 "flight"(항공권 검색, 목적지가 있을 때), "hotel"(숙소 검색, 목적지가 있을 때), "ask"(대화로 이어가기, prompt에 사용자가 보낼 질문을 한국어로 적기) 중 하나. 질문 내용에 맞게 상황에 어울리는 버튼을 골라(예: 일정 답변 뒤엔 상세일정/항공권/숙소, 옷차림 답변 뒤엔 짐 체크리스트/현지 날씨/쇼핑 팁). label은 이모지 포함 15자 이내.
오늘 날짜: ${new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric'})}`;

// ---------- storage ----------
const LS = {
  get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};
const SS = {
  get(k){try{return sessionStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{sessionStorage.setItem(k,v)}catch(e){}},
  del(k){try{sessionStorage.removeItem(k)}catch(e){}}
};
const getKey = () => LS.get('groq_key') || SS.get('groq_key') || '';
const getModel = () => LS.get('groq_model') || 'llama-3.3-70b-versatile';

let history = [];     // {role, content}
let busy = false;

// ---------- helpers ----------
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function md(src){
  const lines = esc(src).split('\n');
  let out = '', list = null;
  const inline = t => t
    .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
    .replace(/(^|[^*])\*(?!\s)(.+?)\*(?!\*)/g,'$1<i>$2</i>')
    .replace(/`(.+?)`/g,'<code>$1</code>');
  const close = () => { if(list){ out += `</${list}>`; list = null; } };
  for(const raw of lines){
    const l = raw.trimEnd(); let m;
    if((m = l.match(/^\s*[-*•]\s+(.*)/))){ if(list!=='ul'){close(); out+='<ul>'; list='ul';} out+=`<li>${inline(m[1])}</li>`; }
    else if((m = l.match(/^\s*\d+[.)]\s+(.*)/))){ if(list!=='ol'){close(); out+='<ol>'; list='ol';} out+=`<li>${inline(m[1])}</li>`; }
    else if((m = l.match(/^#{1,4}\s+(.*)/))){ close(); out+=`<h3>${inline(m[1])}</h3>`; }
    else if(/^\s*(-{3,}|\*{3,})\s*$/.test(l)){ close(); out+='<hr>'; }
    else if(l.trim()===''){ close(); }
    else { close(); out+=`<p>${inline(l)}</p>`; }
  }
  close(); return out;
}
const timeStr = () => new Date().toLocaleTimeString('ko-KR',{hour:'numeric',minute:'2-digit',hour12:true});
const chat = $('chat');
const toBottom = () => { chat.scrollTop = chat.scrollHeight; };

function addDate(){
  const d = document.createElement('div'); d.className='date';
  d.innerHTML = `<span>${new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long'})}</span>`;
  chat.appendChild(d);
}
function addMsg(role, text){
  const row = document.createElement('div'); row.className = 'row ' + (role==='user'?'me':'bot');
  const bubble = document.createElement('div'); bubble.className='bubble';
  if(role==='user'){ bubble.textContent = text; row.innerHTML = `<div class="col"><div class="line"></div></div>`; }
  else { bubble.innerHTML = text ? md(text) : '<div class="typing"><i></i><i></i><i></i></div>';
         row.innerHTML = `<div class="av">${CAT}</div><div class="col"><div class="name">냥이</div><div class="line"></div></div>`; }
  const line = row.querySelector('.line');
  line.appendChild(bubble);
  const t = document.createElement('span'); t.className='time'; t.textContent = timeStr(); line.appendChild(t);
  chat.appendChild(row); toBottom();
  return bubble;
}
function renderChips(){
  const c = $('chips'); c.innerHTML=''; c.style.display=''; c.scrollLeft=0;
  SUGGEST.forEach(s=>{
    const b = document.createElement('button'); b.type='button'; b.className='chip'; b.textContent=s;
    b.onclick = () => { $('input').value = s.replace(/\s*\p{Extended_Pictographic}+\s*$/u,''); send(); };
    c.appendChild(b);
  });
}
function reset(){
  history = []; chat.innerHTML=''; addDate(); addMsg('bot', WELCOME); renderChips();
}

// ---------- photo + next-action buttons ----------
const visible = s => { const i = s.indexOf('[['); return (i>=0 ? s.slice(0,i) : s).trimEnd(); };
function splitMeta(s){
  const m = s.match(/\[\[META\]\]\s*(\{[\s\S]*\})/);
  let meta = null;
  if(m){ try{ meta = JSON.parse(m[1]); }catch(e){} }
  return { text: visible(s), meta };
}
const FALLBACK_ACTS = [
  {label:'📅 더 자세히 알려줘', type:'ask', prompt:'방금 답변을 더 자세히 알려줘'},
  {label:'💡 현지 꿀팁 알려줘', type:'ask', prompt:'이 여행에 도움이 되는 현지 꿀팁을 알려줘'},
  {label:'🧳 준비물 체크리스트', type:'ask', prompt:'이 여행에 필요한 준비물 체크리스트를 만들어줘'}
];
async function wikiPhoto(title){
  try{
    const r = await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(title));
    if(!r.ok) return null;
    const j = await r.json();
    const src = j.thumbnail?.source; if(!src) return null;
    return src.replace(/\/(\d+)px-/, '/640px-');
  }catch(e){ return null; }
}
function runAction(a, meta){
  const dest = meta?.wiki || meta?.place || '';
  if(a.type==='flight'){
    window.open('https://www.google.com/travel/flights?q='+encodeURIComponent('Flights to '+(dest||'')),'_blank','noopener');
  }else if(a.type==='hotel'){
    window.open('https://www.booking.com/searchresults.html?ss='+encodeURIComponent(dest),'_blank','noopener');
  }else{
    input.value = a.prompt || a.label.replace(/^\p{Extended_Pictographic}+\s*/u,''); send();
  }
}
async function attachExtras(bubble, meta){
  const col = bubble.closest('.col');
  document.querySelectorAll('.acts').forEach(e=>e.remove());
  if(meta?.wiki){
    const src = await wikiPhoto(meta.wiki);
    if(src){
      const ph = document.createElement('div'); ph.className='photo';
      ph.innerHTML = `<img alt="${esc(meta.place||meta.wiki)}"><span>📍 ${esc(meta.place||meta.wiki)}</span>`;
      const img = ph.querySelector('img');
      img.onload = toBottom; img.onerror = () => ph.remove(); img.src = src;
      col.appendChild(ph);
    }
  }
  let acts = Array.isArray(meta?.actions) ? meta.actions.filter(a=>a && typeof a.label==='string').slice(0,3) : [];
  if(!acts.length) acts = FALLBACK_ACTS;
  const box = document.createElement('div'); box.className='acts';
  acts.forEach(a=>{
    if((a.type==='flight'||a.type==='hotel') && !(meta?.wiki||meta?.place)) a = FALLBACK_ACTS[0];
    const b = document.createElement('button'); b.type='button'; b.className='act';
    const ext = a.type==='flight'||a.type==='hotel';
    b.innerHTML = `<span>${esc(a.label)}</span><i>${ext?'↗':'›'}</i>`;
    b.onclick = () => runAction(a, meta);
    box.appendChild(b);
  });
  col.appendChild(box); toBottom();
}

// ---------- send ----------
async function send(){
  const input = $('input'); const text = input.value.trim();
  if(!text || busy) return;
  if(!getKey()){ openSheet(false); return; }
  input.value=''; autosize(); updateSend();
  addMsg('user', text); history.push({role:'user', content:text});
  $('chips').style.display='none';
  busy = true; updateSend();
  const bubble = addMsg('bot','');
  let acc = '';
  try{
    const res = await fetch('https://api.groq.com/openai/v1/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+getKey()},
      body: JSON.stringify({
        model:getModel(), stream:true, temperature:0.7, max_tokens:1800,
        messages:[{role:'system',content:SYSTEM()}, ...history.slice(-20)]
      })
    });
    if(!res.ok){
      let msg = '';
      try{ msg = (await res.json()).error?.message || ''; }catch(e){}
      if(res.status===401) throw new Error('API 키가 올바르지 않아요. ⚙️ 설정에서 다시 확인해 주세요.');
      if(res.status===429) throw new Error('요청이 너무 많아요. 잠시 후 다시 시도해 주세요. ('+msg+')');
      if(/does not exist|decommission|not have access/i.test(msg)){
        const ok = await loadModels();
        throw new Error(ok ? '이 모델은 더 이상 쓸 수 없어서 사용 가능한 모델로 바꿨어요. 다시 보내 주세요!' : '선택한 모델을 쓸 수 없어요. ⚙️ 설정에서 모델을 바꿔 주세요.');
      }
      throw new Error(msg || ('오류가 발생했어요 (HTTP '+res.status+')'));
    }
    const reader = res.body.getReader(); const dec = new TextDecoder(); let buf='';
    while(true){
      const {done,value} = await reader.read(); if(done) break;
      buf += dec.decode(value,{stream:true});
      const parts = buf.split('\n'); buf = parts.pop();
      for(const p of parts){
        const s = p.trim(); if(!s.startsWith('data:')) continue;
        const data = s.slice(5).trim(); if(data==='[DONE]') continue;
        try{
          const delta = JSON.parse(data).choices?.[0]?.delta?.content;
          if(delta){ acc += delta; const v = visible(acc); if(v) bubble.innerHTML = md(v); toBottom(); }
        }catch(e){}
      }
    }
    if(!acc) bubble.innerHTML = md('답변을 받지 못했어요 😿 다시 시도해 주세요.');
    else{
      const {text, meta} = splitMeta(acc);
      bubble.innerHTML = md(text || '답변을 정리하지 못했어요 😿');
      history.push({role:'assistant', content:text});
      busy = false; updateSend();
      await attachExtras(bubble, meta);
    }
  }catch(e){
    const m = (e instanceof TypeError) ? '네트워크 연결을 확인해 주세요 😿' : e.message;
    bubble.innerHTML = md('😿 '+m);
    if(!acc) history.pop();
  }finally{
    busy=false; updateSend(); toBottom();
  }
}

// ---------- input UX ----------
const input = $('input');
function autosize(){ input.style.height='auto'; input.style.height=Math.min(input.scrollHeight,110)+'px'; }
function updateSend(){ $('send').disabled = busy || !input.value.trim(); }
input.addEventListener('input',()=>{autosize();updateSend();});
input.addEventListener('keydown',e=>{
  if(e.key==='Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); send(); }
});
$('form').addEventListener('submit',e=>{e.preventDefault();send();});
$('newBtn').onclick = () => { if(!busy) reset(); };

// ---------- settings sheet ----------
function openSheet(isSettings){
  $('sheetBg').classList.add('on');
  $('key').value = getKey(); $('key').type='password';
  $('model').value = getModel();
  $('remember').checked = !!LS.get('groq_key') || !getKey();
  $('err').textContent='';
  $('closeSheet').style.display = isSettings ? 'block':'none';
  $('clearKey').style.display = getKey() ? 'block':'none';
  $('sheetTitle').textContent = isSettings ? '설정' : '냥이와 여행 준비 시작!';
  $('sheetDesc').innerHTML = isSettings ? 'API 키와 모델을 바꿀 수 있어요.'
    : 'Groq API 키를 입력하면 바로 대화할 수 있어요.<br>키는 이 기기의 브라우저에만 저장돼요.';
}
function closeSheet(){ $('sheetBg').classList.remove('on'); input.focus(); }
$('setBtn').onclick = () => openSheet(true);
$('closeSheet').onclick = closeSheet;
$('eye').onclick = () => { const k=$('key'); k.type = k.type==='password' ? 'text':'password'; };
$('save').onclick = async () => {
  const k = $('key').value.trim();
  if(!/^gsk_[A-Za-z0-9]{20,}$/.test(k)){ $('err').textContent='Groq 키 형식(gsk_...)이 아니에요. 다시 확인해 주세요.'; return; }
  const chosen = $('model').value;
  LS.del('groq_key'); SS.del('groq_key');
  ($('remember').checked ? LS : SS).set('groq_key', k);
  if(chosen) LS.set('groq_model', chosen);
  $('save').disabled = true; $('save').textContent = '모델 확인 중...';
  const ok = await loadModels();
  $('save').disabled = false; $('save').textContent = '저장하고 시작하기';
  if(!ok){ $('err').textContent = '키를 확인하지 못했어요. 키가 맞는지, 네트워크가 연결됐는지 확인해 주세요.'; return; }
  closeSheet();
};
$('clearKey').onclick = () => { LS.del('groq_key'); SS.del('groq_key'); $('key').value=''; $('clearKey').style.display='none'; };

// ---------- model list (fetched from Groq so deprecated models never break the app) ----------
async function loadModels(){
  const k = getKey(); if(!k) return false;
  try{
    const r = await fetch('https://api.groq.com/openai/v1/models',{headers:{Authorization:'Bearer '+k}});
    if(!r.ok) return false;
    const ids = (await r.json()).data.map(m=>m.id)
      .filter(id=>!/whisper|guard|tts|playai|orpheus|embed|safeguard|compound/i.test(id));
    if(!ids.length) return false;
    const rank = id => /gpt-oss-120b|llama-3\.3|70b|versatile|maverick|qwen3-32b/i.test(id) ? 0 : 1;
    ids.sort((a,b)=>rank(a)-rank(b) || a.localeCompare(b));
    $('model').innerHTML = ids.map(id=>`<option value="${esc(id)}">${esc(id)}</option>`).join('');
    if(!ids.includes(getModel())) LS.set('groq_model', ids[0]);
    $('model').value = getModel();
    return true;
  }catch(e){ return false; }
}

// ---------- init ----------
reset();
if(!getKey()) openSheet(false); else loadModels();
</script>
